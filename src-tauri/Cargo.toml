[package]
name = "nitean-studio"
version = "0.3.0"
description = "Nitean Studio — narrated explainer video generator (Khmer / English)"
authors = ["Nitean Studio"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nitean_studio_lib"
# Desktop only: no `cdylib` (mobile). With the GNU toolchain a cdylib exceeds the
# 65 535-export limit of ld ("export ordinal too large").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread", "process", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
ulid = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
# Edge TTS (unofficial, see CLAUDE.md). Async tokio client; no blocking/ureq stack.
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"] }
unicode-segmentation = "1"
base64 = "0.22"
async-trait = "0.1"
# JPEG/PNG decode + encode, crop, Lanczos3 resize (images/postprocess.rs)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.45.0"
tauri-plugin-process = "2.4.0"

# DXGI adapter list for local GPU detection (docs/08-local-gpu.md §2). Same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Power"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"

[lints.rust]
# MinGW's ld always links its own default manifest next to ours (build.rs) and prints
# ".rsrc merge failure: multiple non-default manifests". Ours is first and wins; the
# message is harmless. Remove this when building with the MSVC toolchain.
linker_messages = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort): a panic inside a dependency (e.g. the Edge TTS crate) becomes an
# error in that task instead of killing the app.
panic = "unwind"
strip = true
